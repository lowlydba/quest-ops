name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  python:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # checks out the code
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest coverage
      - name: Test with coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report
          python -m coverage xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage
          path: coverage.xml

  shim:
    name: node ${{ matrix.node }} shim
    runs-on: ubuntu-latest
    permissions:
      contents: read # checks out the code
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: for f in dist/index.js dist/lib/*.js; do node --check "$f"; done
      - name: Test
        if: matrix.node != 24
        run: node --test tests/shim/shim.test.js tests/shim/modules.test.js
      - name: Test with coverage
        if: matrix.node == 24
        run: >
          node --test
          --experimental-test-coverage
          "--test-coverage-include=dist/**/*.js"
          --test-coverage-lines=100
          --test-coverage-branches=100
          --test-coverage-functions=100
          tests/shim/shim.test.js tests/shim/modules.test.js

  scripts:
    name: shell and docker
    runs-on: ubuntu-latest
    permissions:
      contents: read # checks out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck scripts/data-branch.sh
      - name: Docker image smoke test
        run: |
          docker build -t questops .
          docker run --rm questops --version
          docker run --rm questops

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read # checks out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Audit workflows and the action
        run: |
          python -m pip install zizmor==1.30.1
          zizmor --persona pedantic --offline .

  are-we-good:
    name: are-we-good
    if: always()
    needs: [python, shim, scripts, zizmor]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every lane passed
        run: |
          echo "$RESULTS"
          test "$(echo "$RESULTS" | jq '[.[] | select(.result != "success")] | length')" = 0
        env:
          RESULTS: ${{ toJSON(needs) }}
